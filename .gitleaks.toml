# Gitleaks config — complements scripts/check-secrets.mjs. Keep both scanners aligned:
# a file may escape a scanner ONLY when it defines detection patterns (which necessarily
# resemble secrets) or holds declared synthetic fixtures (TESTONLY/EXAMPLE markers).
# Any new such file must be allowlisted in BOTH this config and check-secrets.mjs,
# and named in docs/security/secret-policy.md — reviewer care required on every touch.
[extend]
useDefault = true

# Detection-pattern definitions necessarily resemble secrets.
[[allowlists]]
description = "pattern definitions"
paths = [
  '''packages/security/src/secret-patterns\.ts''',
  '''scripts/check-secrets\.mjs''',
]

# Declared synthetic fixtures only (TESTONLY-marked shapes used by security tests).
[[allowlists]]
description = "declared test fixtures"
paths = [
  '''tests/security/secret-redaction\.test\.mjs''',
]
